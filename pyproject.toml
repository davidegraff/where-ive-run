[project]
name = "where-ive-run"
version = "0.4.0"
description = "API server for Where I've Run: ingests activity archives and serves them to the map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "fitdecode>=0.10", # used by the old scripts/ importers (the server has its own FIT reader)
    "requests>=2.34.2",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["server", "tests"]

[[tool.mypy.overrides]]
module = ["fitdecode", "fitdecode.*"]
ignore_missing_imports = true
