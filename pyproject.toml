[project]
name = "where-ive-run"
version = "0.1.0"
description = "Interactive heatmap of every activity in a Strava bulk export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fitdecode>=0.10", # reads .fit / .fit.gz activity files in the Strava export
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "types-requests>=2.33.0.20261030",
]
